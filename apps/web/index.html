<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#267359" />
    <meta name="description" content="Zagent, a synthetic clinical genomics workspace." />
    <title>Zagent | Clinical Genomics</title>
    <script>
      try {
        var saved = localStorage.getItem('zagent.theme')
      } catch (error) {}
      document.documentElement.dataset.theme =
        saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
