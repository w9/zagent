name: zagent

# Zones: clinical data, the agent, knowledge and telemetry are separate internal networks.
# Services on two zones only serve fixed ports; relays forward one direction.
x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318

services:
  postgres:
    image: postgres:16-alpine
    networks: [clinical]
    environment:
      POSTGRES_USER: zagent
      POSTGRES_PASSWORD: zagent
      POSTGRES_DB: zagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/compose/init.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zagent -d zagent"]
      interval: 1s
      timeout: 3s
      retries: 30

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgresql://zagent_runtime:zagent_runtime@event-db:5432/zagent
      ZAGENT_SCRIPT: "${ZAGENT_SCRIPT:-}"
      ZAGENT_AGENT: "${ZAGENT_AGENT:-llm}"
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_GATEWAY_URL: http://gateway:8001
      ZAGENT_TOOLS_URL: http://tools:8002/mcp
      ZAGENT_JOBS_URL: http://jobs:8005/mcp
      ZAGENT_BROKER_URL: http://mcp-broker:8008/mcp
      ZAGENT_FROZEN_TIME: "${ZAGENT_FROZEN_TIME:-}"
      ZAGENT_DISPLAY_MODE: "0"
      ZAGENT_MIGRATE: "0"
      ZAGENT_PRIVACY_URL: http://tokenizer:8006
      ZAGENT_PRIVACY_CAPABILITY_FILE: /run/privacy/tokenize.key
    volumes:
      - privacy_tokenize:/run/privacy:ro
    networks: [agent]
    depends_on:
      event-db:
        condition: service_healthy
      gateway:
        condition: service_healthy
      tools:
        condition: service_healthy
      jobs:
        condition: service_healthy
      mcp-broker:
        condition: service_healthy
      tokenizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["uvicorn", "zagent.gateway:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *telemetry
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_MODEL: "${ZAGENT_MODEL:-openai/gpt-6-luna}"
      ZAGENT_MODEL_ROUTES: "${ZAGENT_MODEL_ROUTES:-}"
      ZAGENT_GATEWAY_AUDIT: /var/lib/zagent/gateway-audit.sqlite3
      ZAGENT_PRIVACY_URL: http://tokenizer:8006
      ZAGENT_PRIVACY_CAPABILITY_FILE: /run/privacy/gateway.key
    volumes:
      - gateway_audit:/var/lib/zagent
      - privacy_gateway:/run/privacy:ro
    networks: [agent, egress]
    depends_on:
      tokenizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  tools:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["uvicorn", "zagent.tools_server:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *telemetry
      DATABASE_URL: postgresql://zagent:zagent@postgres:5432/zagent
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_FROZEN_TIME: "${ZAGENT_FROZEN_TIME:-}"
      ZAGENT_PRIVACY_URL: http://privacy:8003
      ZAGENT_PRIVACY_CAPABILITY_FILE: /run/privacy/tools.key
    volumes:
      - privacy_tools:/run/privacy:ro
    networks: [clinical, agent]
    depends_on:
      postgres:
        condition: service_healthy
      privacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  jobs:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["uvicorn", "zagent.jobs_server:app", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      <<: *telemetry
      DATABASE_URL: postgresql://zagent:zagent@postgres:5432/zagent
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_FROZEN_TIME: "${ZAGENT_FROZEN_TIME:-}"
      ZAGENT_PRIVACY_URL: http://privacy:8003
      ZAGENT_PRIVACY_CAPABILITY_FILE: /run/privacy/tools.key
    volumes:
      - privacy_tools:/run/privacy:ro
    networks: [clinical, agent]
    depends_on:
      privacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Knowledge team: publishes snapshots offline and serves them only on the knowledge zone.
  kb-publish:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    command: ["kb-publish", "--target", "/var/lib/zknowledge/snapshots"]
    network_mode: none
    volumes:
      - kb_snapshots:/var/lib/zknowledge/snapshots

  kb:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    environment:
      <<: *telemetry
      ZKNOWLEDGE_SNAPSHOTS: /var/lib/zknowledge/snapshots
    volumes:
      - kb_snapshots:/var/lib/zknowledge/snapshots:ro
    networks: [knowledge]
    depends_on:
      kb-publish:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The agent zone's only route to knowledge: contract pinning and tokenization.
  mcp-broker:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["uvicorn", "zagent.broker:app", "--host", "0.0.0.0", "--port", "8008"]
    environment:
      <<: *telemetry
      ZAGENT_KB_URL: http://kb:8007/mcp
      ZAGENT_KB_SNAPSHOT: "${ZAGENT_KB_SNAPSHOT:-}"
      ZAGENT_PRIVACY_URL: http://tokenizer:8006
      ZAGENT_PRIVACY_CAPABILITY_FILE: /run/privacy/tokenize.key
    volumes:
      - privacy_tokenize:/run/privacy:ro
    networks: [agent, knowledge]
    depends_on:
      kb:
        condition: service_healthy
      tokenizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  dispatcher:
    image: zagent-job:plan8
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["python", "-m", "zagent.dispatcher"]
    restart: unless-stopped
    environment:
      <<: *telemetry
      DATABASE_URL: postgresql://zagent:zagent@postgres:5432/zagent
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-zagent}"
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_FROZEN_TIME: "${ZAGENT_FROZEN_TIME:-}"
      ZAGENT_JOB_STEP_SECONDS: "${ZAGENT_JOB_STEP_SECONDS:-2}"
      ZAGENT_PRIVACY_URL: http://privacy:8003
      ZAGENT_PRIVACY_CAPABILITY_FILE: /run/privacy/tools.key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - privacy_tools:/run/privacy:ro
    networks: [clinical]
    depends_on:
      privacy:
        condition: service_healthy
      collector:
        condition: service_started

  collector:
    image: otel/opentelemetry-collector:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/compose/otel.yaml:/etc/otelcol/config.yaml:ro
    networks: [clinical, agent, knowledge, telemetry]
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/compose/tempo.yaml:/etc/tempo/config.yaml:ro
    tmpfs:
      - /var/tempo:mode=1777
    networks: [telemetry]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/compose/grafana.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
    networks: [telemetry]
    depends_on:
      tempo:
        condition: service_started

  privacy-init:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["python", "-m", "zagent.privacy_init"]
    network_mode: none
    volumes:
      - privacy_master:/keys/master
      - privacy_tokenize:/keys/tokenize
      - privacy_display:/keys/display
      - privacy_tools:/keys/tools
      - privacy_gateway:/keys/gateway

  privacy:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["uvicorn", "zagent.privacy_server:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      <<: *telemetry
      DATABASE_URL: postgresql://zagent:zagent@postgres:5432/zagent
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_FROZEN_TIME: "${ZAGENT_FROZEN_TIME:-}"
    volumes:
      - privacy_master:/run/privacy:ro
    networks: [clinical]
    depends_on:
      postgres:
        condition: service_healthy
      privacy-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The agent zone's only privacy endpoint: tokenize and tripwire, no resolution routes.
  tokenizer:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["uvicorn", "zagent.privacy_server:create_tokenizer_app", "--factory", "--host", "0.0.0.0", "--port", "8006"]
    environment:
      <<: *telemetry
      DATABASE_URL: postgresql://zagent:zagent@postgres:5432/zagent
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_FROZEN_TIME: "${ZAGENT_FROZEN_TIME:-}"
    volumes:
      - privacy_master:/run/privacy:ro
    networks: [clinical, agent]
    depends_on:
      privacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Role-pinned proxy: the agent reaches only the event database, as zagent_runtime.
  event-db:
    build:
      context: deploy/compose
      dockerfile: EventDB.Dockerfile
    volumes:
      - ./deploy/compose/event-db:/etc/event-db:ro
    networks: [clinical, agent]
    depends_on:
      privacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5432"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Clinical-to-agent only: forwards to the runtime and gateway, never back.
  display-relay:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["python", "-m", "zagent.relay"]
    environment:
      ZAGENT_RELAY_ROUTES: 8000=agent:8000,8001=gateway:8001
    networks: [clinical, agent]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Host loopback ports. The edge network publishes ports but has no outbound NAT.
  ingress:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    command: ["python", "-m", "zagent.relay"]
    environment:
      ZAGENT_RELAY_ROUTES: 5173=web:5173,8000=bff:8000,5432=postgres:5432,3000=grafana:3000
    ports:
      - "127.0.0.1:${ZAGENT_WEB_PORT:-5173}:5173"
      - "127.0.0.1:${ZAGENT_AGENT_PORT:-8000}:8000"
      - "127.0.0.1:${ZAGENT_DB_PORT:-5432}:5432"
      - "127.0.0.1:${ZAGENT_GRAFANA_PORT:-3000}:3000"
    networks: [edge, clinical, telemetry]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5432), 2)"]
      interval: 2s
      timeout: 5s
      retries: 30

  bff:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      <<: *telemetry
      DATABASE_URL: postgresql://zagent:zagent@postgres:5432/zagent
      ZAGENT_LLM_MODE: "${ZAGENT_LLM_MODE:-replay}"
      ZAGENT_DISPLAY_MODE: "1"
      ZAGENT_MIGRATE: "0"
      ZAGENT_RUNTIME_URL: http://display-relay:8000
      ZAGENT_GATEWAY_URL: http://display-relay:8001
      ZAGENT_JOBS_URL: http://jobs:8005/mcp
      ZAGENT_PRIVACY_URL: http://privacy:8003
      ZAGENT_PRIVACY_CAPABILITY_FILE: /run/privacy/display.key
      ZAGENT_FROZEN_TIME: "${ZAGENT_FROZEN_TIME:-}"
    volumes:
      - privacy_display:/run/privacy:ro
    networks: [clinical]
    depends_on:
      agent:
        condition: service_healthy
      display-relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      AGENT_URL: http://bff:8000
    networks: [clinical]
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  gateway_audit:
  kb_snapshots:
  privacy_master:
  privacy_tokenize:
  privacy_display:
  privacy_tools:
  privacy_gateway:

networks:
  clinical:
    internal: true
  agent:
    internal: true
  knowledge:
    internal: true
  telemetry:
    internal: true
  egress:
  edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
