[databases]
zagent = host=postgres port=5432 dbname=zagent user=zagent_runtime password=zagent_runtime
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/event-db/users.txt
pool_mode = session
max_client_conn = 100
default_pool_size = 40
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
