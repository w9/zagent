cases:
  - id: REAL-001
    requirement: REQ-CTX-01
    agent: llm:default
    conversation_turns:
      - user: What specimens came in yesterday for patient NGC-0041872?
      - user: What libraries belong to those specimens?
      - user: Show a coverage chart for those libraries.
    expect:
      golden: goldens/REAL-001.json
      egress: no_known_identifiers
      event_log: no_known_identifiers
      events_include: [tool_call, tool_result, artifact_published, step_started, step_finished, conversation_turn_finished]
      events_exclude: [conversation_turn_failed]
      artifacts:
        - kind: table
          props_match: {row_count: 3}
        - kind: table
          props_match: {row_count: 3}
        - kind: chart
      artifact_count: 3
      tools_only_handles: true
      numeric_claims_grounded: true
      references_resolve: true
      artifact_references: true
      artifact_narration: true
      refusal: none
      tools_called: [find_patients, find_specimens, find_libraries, push_view]

  - id: REAL-002
    requirement: REQ-GROUND-01
    agent: llm:default
    conversation_turns:
      - user: How many specimens arrived in the last 24 hours? Show a table and report only the count.
    expect:
      golden: goldens/REAL-002.json
      egress: no_known_identifiers
      event_log: no_known_identifiers
      events_include: [tool_call, tool_result, artifact_published, conversation_turn_finished]
      events_exclude: [conversation_turn_failed]
      artifacts:
        - kind: table
          props_match: {row_count: 29}
      artifact_count: 1
      tools_only_handles: true
      numeric_claims_grounded: true
      refusal: none
      artifact_narration: true
      tools_called: [find_specimens, push_view]