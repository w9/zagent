  contextual_continuations:
    - id: SCOPE-CTX-001
      user: "yes"
      label: none
      context: &library_question
        - {role: user, content: "Find specimens for patient NGC-0041872."}
        - {role: assistant, content: "I found the specimen query. Would you like me to find their libraries?"}
    - {id: SCOPE-CTX-002, user: "Yes please.", label: none, context: *library_question}
    - {id: SCOPE-CTX-003, user: "Go ahead with that.", label: none, context: *library_question}
    - {id: SCOPE-CTX-004, user: "Please do.", label: none, context: *library_question}
    - {id: SCOPE-CTX-005, user: "No, just the table for now.", label: none, context: *library_question}
    - {id: SCOPE-CTX-006, user: "Only the ones needing review.", label: none, context: *library_question}
    - {id: SCOPE-CTX-007, user: "All of them.", label: none, context: *library_question}
    - {id: SCOPE-CTX-008, user: "Those two.", label: none, context: *library_question}
    - {id: SCOPE-CTX-009, user: "Include the failed ones too.", label: none, context: *library_question}
    - {id: SCOPE-CTX-010, user: "Not yet; what columns would I get?", label: none, context: *library_question}
    - id: SCOPE-CTX-011
      user: "P7D"
      label: none
      context: &window_question
        - {role: user, content: "Show the specimen intake."}
        - {role: assistant, content: "Which receipt window should I use: the last day, week, or month?"}
    - {id: SCOPE-CTX-012, user: "The last day.", label: none, context: *window_question}
    - {id: SCOPE-CTX-013, user: "A week, please.", label: none, context: *window_question}
    - {id: SCOPE-CTX-014, user: "30 days.", label: none, context: *window_question}
    - {id: SCOPE-CTX-015, user: "Use the second option.", label: none, context: *window_question}
    - {id: SCOPE-CTX-016, user: "Yesterday.", label: none, context: *window_question}
    - {id: SCOPE-CTX-017, user: "P1D, actually.", label: none, context: *window_question}
    - {id: SCOPE-CTX-018, user: "The broadest of those.", label: none, context: *window_question}
    - {id: SCOPE-CTX-019, user: "Change it to P30D.", label: none, context: *window_question}
    - {id: SCOPE-CTX-020, user: "Same as before: seven days.", label: none, context: *window_question}
    - id: SCOPE-CTX-021
      user: "the second one"
      label: none
      context: &view_question
        - {role: user, content: "Show the library query."}
        - {role: assistant, content: "Would you prefer a table or a coverage bar chart?"}
    - {id: SCOPE-CTX-022, user: "Bars.", label: none, context: *view_question}
    - {id: SCOPE-CTX-023, user: "A table instead.", label: none, context: *view_question}
    - {id: SCOPE-CTX-024, user: "Both, one after the other.", label: none, context: *view_question}
    - {id: SCOPE-CTX-025, user: "Points rather than bars.", label: none, context: *view_question}
    - {id: SCOPE-CTX-026, user: "The first option.", label: none, context: *view_question}
    - {id: SCOPE-CTX-027, user: "Yes, a chart.", label: none, context: *view_question}
    - {id: SCOPE-CTX-028, user: "Use coverage on the vertical axis.", label: none, context: *view_question}
    - {id: SCOPE-CTX-029, user: "Call it Coverage review.", label: none, context: *view_question}
    - {id: SCOPE-CTX-030, user: "Keep the same data and switch the view.", label: none, context: *view_question}
    - id: SCOPE-CTX-031
      user: "43"
      label: none
      context: &draft_question
        - {role: user, content: "I am editing the pending analysis draft, not submitting it."}
        - {role: assistant, content: "What value should param1 have in that draft?"}
      draft: &pending_draft {status: editing, specimen_handle: query-0002, parameters: {param1: null}}
    - {id: SCOPE-CTX-032, user: "param1=43", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-033, user: "Make it 20.", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-034, user: "Use the default.", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-035, user: "Leave it unset.", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-036, user: "Actually, 42 rather than 43.", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-037, user: "What is the allowed range for that field?", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-038, user: "Keep this as a draft only.", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-039, user: "Cancel that edit.", label: none, context: *draft_question, draft: *pending_draft}
    - {id: SCOPE-CTX-040, user: "Show me the current parameter value first.", label: none, context: *draft_question, draft: *pending_draft}
    - id: SCOPE-CTX-041
      user: "NGC-0041872"
      label: none
      context: &patient_question
        - {role: user, content: "I need to find a patient's specimens."}
        - {role: assistant, content: "What is the patient's exact MRN?"}
    - {id: SCOPE-CTX-042, user: "NGC-0041873, sorry.", label: none, context: *patient_question}
    - {id: SCOPE-CTX-043, user: "I mistyped; it ends in 74.", label: none, context: *patient_question}
    - {id: SCOPE-CTX-044, user: "Can you show all of ours instead?", label: none, context: *patient_question}
    - {id: SCOPE-CTX-045, user: "Use the patient from the previous result.", label: none, context: *patient_question}
    - {id: SCOPE-CTX-046, user: "I don't have it; what can I search by?", label: none, context: *patient_question}
    - {id: SCOPE-CTX-047, user: "Exact match only, please.", label: none, context: *patient_question}
    - {id: SCOPE-CTX-048, user: "The one we just looked up.", label: none, context: *patient_question}
    - {id: SCOPE-CTX-049, user: "Let me correct that identifier.", label: none, context: *patient_question}
    - {id: SCOPE-CTX-050, user: "Never mind, show recent intake for this site.", label: none, context: *patient_question}

