[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zagent"
version = "0.1.0"
description = "An event-backed, resumable agent workbench"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpx-sse>=0.4,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
zagent = "zagent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["services/agent/zagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["services/agent/tests", "evals"]
markers = ["integration: requires Postgres", "chaos: seeded SSE interruption trials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
