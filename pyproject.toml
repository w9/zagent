[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zagent"
version = "0.1.0"
description = "An event-backed, resumable agent workbench"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30,<1",
    "docker>=7,<8",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpx-sse>=0.4,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "markdown-it-py>=3,<5",
    "mcp>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-asyncpg>=0.51b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-instrumentation-httpx>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
zagent = "zagent.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "zknowledge",
]

[tool.uv.workspace]
members = ["services/knowledge"]

[tool.uv.sources]
zknowledge = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["services/agent/zagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["services/agent/tests", "services/knowledge/tests", "evals"]
markers = ["integration: requires Postgres", "chaos: seeded SSE interruption trials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
