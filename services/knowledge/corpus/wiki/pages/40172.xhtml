<p>Autopipe writes CRAM files since release 2026.2. CRAM is smaller than BAM but needs the exact reference genome to decode.</p>
<h1>Convert CRAM to BAM</h1>
<ac:structured-macro ac:name="code"><ac:plain-text-body><![CDATA[samtools view -b -T ref/grch38/genome.fa -o out.bam in.cram
samtools index out.bam]]></ac:plain-text-body></ac:structured-macro>
<h1>Extract a region</h1>
<ac:structured-macro ac:name="code"><ac:plain-text-body><![CDATA[samtools view -b -T ref/grch38/genome.fa in.cram chr17:7661779-7687538 > tp53.bam]]></ac:plain-text-body></ac:structured-macro>
<ac:structured-macro ac:name="warning"><ac:rich-text-body><p>Decoding with the wrong reference gives silently wrong bases. Always use the alias from the reference library page.</p></ac:rich-text-body></ac:structured-macro>
