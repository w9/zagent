# Labeled retrieval queries for the knowledge service. A hit is relevant when it comes from the
# listed document and its line range includes the line containing the `contains` text.
# The default caller is an analyst at Northgate. `must_not` lists documents the caller must never
# see in any result; those checks are invariants, not part of the measured recall.
default_caller: {site: northgate, roles: [analyst]}
gate: {k: 5, min_recall_lower_bound: 0.85}
queries:
  # QMS: controlled documents
