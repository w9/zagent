[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zknowledge"
version = "0.1.0"
description = "The knowledge team's read-only, snapshot-addressed knowledge service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
kb-publish = "zknowledge.publish:main"

[tool.hatch.build.targets.wheel]
packages = ["zknowledge"]
