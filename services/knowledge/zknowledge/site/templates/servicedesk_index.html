{% extends "base.html" %}
{% block main %}
<div class="index">
  <h1>Issues</h1>
  <form class="filters" action="/servicedesk" method="get">
    <label for="type">Type</label>
    <select id="type" name="type">
      <option value="">All types</option>
      {% for value in kinds %}<option value="{{ value }}"{% if kind == value %} selected{% endif %}>{{ value|kind }}</option>{% endfor %}
    </select>
    <label for="status">Status</label>
    <select id="status" name="status">
      <option value="">All statuses</option>
      {% for value in statuses %}<option value="{{ value }}"{% if status == value %} selected{% endif %}>{{ value|capitalize }}</option>{% endfor %}
    </select>
    <button type="submit">Filter</button>
  </form>
  <table class="register">
    <thead><tr><th scope="col">Key</th><th scope="col">Summary</th><th scope="col">Type</th><th scope="col">Status</th><th scope="col">Created</th></tr></thead>
    <tbody>
    {% for issue in issues %}
    <tr><td><a href="{{ issue.href }}">{{ issue.key }}</a></td><td>{{ issue.title }}</td><td>{{ issue.doc_type|kind }}</td><td><span class="status status-{{ issue.status }}">{{ issue.status|capitalize }}</span></td><td>{{ issue.created }}</td></tr>
    {% else %}
    <tr><td colspan="5">No issues match this filter.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
